name: Sales CI

# First automated check the repo has had, on every push and PR to main.
#
# Typecheck is the BLOCKING gate: `tsc --noEmit` is green today and catches the
# regression class a reviewer can't reliably catch by eye before it reaches the
# Vercel deploy.
#
# Lint runs but does NOT block (continue-on-error): the app currently carries ~34
# lint errors, most of them strict React-Compiler rules (setState-in-effect,
# impure-function-during-render) that predate this workflow. The step keeps the
# output visible in CI so the backlog can be burned down; flip it to blocking
# once `npm run lint` is clean.
#
# `next build` is deliberately NOT run here: several pages execute server
# components that hit the database, and the build would fail in CI without the
# production DB secrets. Add a build job (with the DB_* / NEXTAUTH_* values wired
# in as GitHub Actions secrets) once that's set up — the scripts are ready
# (`npm run build`).

# Scoped with `paths` so a change to another app in this monorepo does not run
# the sales checks. GitHub only reads .github/workflows from the repo ROOT, so
# this file cannot live in apps/sales — moving it there during the migration
# would have silently stopped the only automated gate this repo has.
on:
  push:
    branches: [main]
    paths: ['apps/sales/**', '.github/workflows/sales-ci.yml']
  pull_request:
    branches: [main]
    paths: ['apps/sales/**', '.github/workflows/sales-ci.yml']

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    # Every `run` below is relative to the app, so npm finds its own lockfile.
    defaults:
      run:
        working-directory: apps/sales
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/sales/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocking)
        run: npm run typecheck

      - name: Lint (non-blocking — see workflow header)
        continue-on-error: true
        run: npm run lint
